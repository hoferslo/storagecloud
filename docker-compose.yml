services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  nextcloud:
    image: nextcloud:stable-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?Set NEXTCLOUD_ADMIN_USER in .env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Set NEXTCLOUD_ADMIN_PASSWORD in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_DOMAIN:?Set NEXTCLOUD_DOMAIN in .env} 127.0.0.1 localhost
      TRUSTED_PROXIES: 172.16.0.0/12
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-1024M}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT:-10G}
      APACHE_DISABLE_REWRITE_IP: 1
    ports:
      - "${NEXTCLOUD_LOCAL_BIND:-127.0.0.1}:${NEXTCLOUD_LOCAL_PORT:-8080}:80"
    volumes:
      - nextcloud:/var/www/html
      - nextcloud_data:/var/www/html/data
    networks:
      - internal
      - tunnel

  cron:
    image: nextcloud:stable-apache
    restart: unless-stopped
    depends_on:
      - nextcloud
    entrypoint: /cron.sh
    volumes:
      - nextcloud:/var/www/html
      - nextcloud_data:/var/www/html/data
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - nextcloud
    networks:
      - tunnel

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    command:
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?Set TURN_SECRET in .env}
      - --realm=${TURN_REALM:-storagecloud.download}
      - --total-quota=100
      - --bps-capacity=0
      - --stale-nonce=600
      - --no-cli
      - --no-tls
      - --no-dtls
      - --log-file=stdout
      - --external-ip=${TURN_EXTERNAL_IP:-auto}
    ports:
      - "${TURN_BIND:-0.0.0.0}:3478:3478/tcp"
      - "${TURN_BIND:-0.0.0.0}:3478:3478/udp"
      - "${TURN_BIND:-0.0.0.0}:49160-49200:49160-49200/udp"
    networks:
      - tunnel

  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    restart: unless-stopped
    depends_on:
      - immich-redis
      - immich-database
    environment:
      IMMICH_VERSION: ${IMMICH_VERSION:-release}
      DB_HOSTNAME: immich-database
      DB_USERNAME: ${IMMICH_DB_USERNAME:-postgres}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in .env}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME:-immich}
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
      TZ: ${TZ:-Europe/Ljubljana}
    volumes:
      - immich_uploads:/usr/src/app/upload
    ports:
      - "${IMMICH_LOCAL_BIND:-127.0.0.1}:${IMMICH_LOCAL_PORT:-2283}:2283"
    networks:
      - immich
      - tunnel

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Ljubljana}
    volumes:
      - immich_model_cache:/cache
    networks:
      - immich

  immich-redis:
    image: valkey/valkey:8-bookworm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - immich

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in .env}
      POSTGRES_USER: ${IMMICH_DB_USERNAME:-postgres}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - immich_database:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - immich

volumes:
  db:
  redis:
  nextcloud:
  nextcloud_data:
  immich_uploads:
  immich_database:
  immich_model_cache:

networks:
  internal:
    internal: true
  tunnel:
  immich:
    internal: true
